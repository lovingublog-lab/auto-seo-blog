name: Verify live pages and cover images

on:
  workflow_run:
    workflows: ["Deploy Astro site to Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  live-smoke-test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify published pages, SVG, and current cover cards
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import re
          import time
          import urllib.error
          import urllib.request
          from zoneinfo import ZoneInfo

          sites = [
              ("lifetechnote.com", "website-opens-only-on-one-device-check"),
              ("homelifenote.com", "entryway-parcels-and-bags-storage-flow"),
              ("travelreadynote.com", "flight-ticket-passport-english-name-mismatch"),
              ("worktoolnote.com", "report-numbers-source-data-mismatch-check"),
          ]
          published = datetime.date(2026, 10, 23)
          today = datetime.datetime.now(ZoneInfo("Asia/Seoul")).date()
          card_window = (today - published).days <= 2
          date_string = "2026년 10월 23일"

          def fetch(url):
              failure = None
              for attempt in range(30):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "BlogFleet-LiveSmoke/1.0"})
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          if resp.status != 200:
                              raise RuntimeError(f"HTTP {resp.status}")
                          return resp.read().decode("utf-8")
                  except Exception as exc:
                      failure = exc
                      if attempt < 29:
                          time.sleep(10)
              raise RuntimeError(f"{url}: {failure}")

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          for host, slug in sites:
              base = "https://" + host
              image_path = "/images/" + slug + ".svg"
              print(f"Checking {host}/{slug}", flush=True)
              article = fetch(base + "/blog/" + slug + "/")
              cover = fetch(base + image_path)
              home = fetch(base + "/")
              archive = fetch(base + "/articles/")
              require(image_path in article, host + ": article cover path missing")
              require("<svg" in cover and 'width="1200"' in cover and 'height="675"' in cover,
                      host + ": SVG content or dimensions missing")
              require(date_string in article, host + ": KST publication date missing")
              require(re.search(r"/images/[a-z0-9-]+[.]svg", home),
                      host + ": homepage has no SVG cover card")
              require(re.search(r"/images/[a-z0-9-]+[.]svg", archive),
                      host + ": archive has no SVG cover card")
              if card_window:
                  require(image_path in home, host + ": new article not shown on home card")
                  require(image_path in archive, host + ": new article not shown on archive card")
              print(f"PASS {host}: article, SVG, KST date, home/archive cards", flush=True)
          PY
