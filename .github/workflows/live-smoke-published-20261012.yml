name: Verify live pages and cover images

on:
  workflow_run:
    workflows: ["Deploy Astro site to Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  live-smoke-test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check live article, SVG, home and archive cards
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          while IFS='|' read -r host slug expected_date; do
            site="https://${host}"
            echo "::group::${site} / ${slug}"
            curl -fLsS --retry 6 --retry-delay 5 --retry-all-errors --max-time 30 "${site}/blog/${slug}/" -o "${work}/article.html"
            curl -fLsS --retry 6 --retry-delay 5 --retry-all-errors --max-time 30 "${site}/images/${slug}.svg" -o "${work}/cover.svg"
            curl -fLsS --retry 6 --retry-delay 5 --retry-all-errors --max-time 30 "${site}/" -o "${work}/home.html"
            curl -fLsS --retry 6 --retry-delay 5 --retry-all-errors --max-time 30 "${site}/articles/" -o "${work}/archive.html"
            grep -Fq "/images/${slug}.svg" "${work}/article.html"
            grep -Fq "<svg " "${work}/cover.svg"
            grep -Fq "width=\"1200\" height=\"675\"" "${work}/cover.svg"
            grep -Fq "/images/${slug}.svg" "${work}/home.html"
            grep -Fq "/images/${slug}.svg" "${work}/archive.html"
            grep -Fq "${expected_date}" "${work}/article.html"
            echo "PASS: live page, SVG, home card, archive card, KST date"
            echo "::endgroup::"
          done <<'SITES'
          lifetechnote.com|smartphone-app-crash-one-app-or-system|2026년 10월 12일
          homelifenote.com|refrigerator-vegetable-wilting-moisture-storage|2026년 10월 12일
          travelreadynote.com|train-platform-change-station-check|2026년 10월 12일
          worktoolnote.com|shared-file-link-permission-before-sending|2026년 10월 12일
          lifetechnote.com|login-alert-not-me-account-safety|2026년 10월 13일
          homelifenote.com|kitchen-utensil-drawer-access-storage|2026년 10월 13일
          travelreadynote.com|travel-map-location-dot-wrong|2026년 10월 13일
          worktoolnote.com|spreadsheet-number-stored-as-text-sum|2026년 10월 13일
          lifetechnote.com|smartphone-camera-blurry-focus-check|2026년 10월 14일
          homelifenote.com|bathroom-drain-odor-cause-check|2026년 10월 14일
          travelreadynote.com|travel-card-payment-declined-check|2026년 10월 14일
          worktoolnote.com|work-request-inbox-single-tracker|2026년 10월 14일
          lifetechnote.com|phone-hotspot-connected-no-internet|2026년 10월 15일
          homelifenote.com|clothes-shrank-after-wash-fabric-check|2026년 10월 15일
          travelreadynote.com|travel-esim-no-data-on-arrival|2026년 10월 15일
          worktoolnote.com|csv-leading-zero-code-preservation|2026년 10월 15일
          SITES
